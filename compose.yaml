services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: routewise-web
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=RouteWise
      - DEBUG=false
      - DEMO_MODE=true
      - SECRET_KEY=production-secure-random-key-routewise-bengaluru-32chars
      - DATABASE_URL=postgresql+asyncpg://routewise:routewise_pass@db:5432/routewise
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - POSTGIS_AVAILABLE=true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  db:
    image: postgis/postgis:16-3.4
    container_name: routewise-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: routewise
      POSTGRES_PASSWORD: routewise_pass
      POSTGRES_DB: routewise
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U routewise -d routewise"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: routewise-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: routewise-worker
    restart: unless-stopped
    command: ["celery", "-A", "app.tasks.celery_app", "worker", "--loglevel=info"]
    environment:
      - DATABASE_URL=postgresql+asyncpg://routewise:routewise_pass@db:5432/routewise
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - SECRET_KEY=production-secure-random-key-routewise-bengaluru-32chars
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy

  beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: routewise-beat
    restart: unless-stopped
    command: ["celery", "-A", "app.tasks.celery_app", "beat", "--loglevel=info"]
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - SECRET_KEY=production-secure-random-key-routewise-bengaluru-32chars
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:

